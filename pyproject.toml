[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ph-repo-auditor"
version = "0.1.0"
description = "GitHub App and CLI for auditing public-health research repository quality."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Khalilur Rahman Ridoy Khan"}]
maintainers = [
  {name = "Khalilur Rahman Ridoy Khan", email = "khalilurrahmanridoykhan@gmail.com"},
]
keywords = ["public health", "reproducibility", "github app", "research software"]
dependencies = [
  "cryptography>=42,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "PyJWT>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
ph-repo-audit = "ph_repo_auditor.cli:main"

[project.urls]
Homepage = "https://github.com/khalilurrrahmanridoykhan/public-health-repository-quality-auditor"
Issues = "https://github.com/khalilurrrahmanridoykhan/public-health-repository-quality-auditor/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
